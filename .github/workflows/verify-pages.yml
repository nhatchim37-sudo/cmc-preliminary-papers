name: Verify published CMC archive

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out archive
        uses: actions/checkout@v4
      - name: Verify live page, PDF headers, and checksums
        env:
          SITE_URL: https://nhatchim37-sudo.github.io/cmc-preliminary-papers/
        run: |
          python3 - <<'PY'
          import concurrent.futures
          import hashlib
          import json
          import os
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import quote, urljoin, urlsplit
          from urllib.request import Request, urlopen

          class Links(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.targets = set()
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  href = attrs.get("href", "")
                  if tag == "a" and href and not urlsplit(href).scheme and not href.startswith("#"):
                      self.targets.add(href)

          base = os.environ["SITE_URL"]
          expected_page = Path("index.html").read_bytes()
          headers = {"User-Agent": "CMC-Pages-Verification/1.0", "Accept-Encoding": "identity"}
          with urlopen(Request(base + "?stage=final", headers=headers), timeout=45) as response:
              actual_page = response.read()
              assert response.status == 200
              assert actual_page == expected_page, "Live index differs from the checked-out version"
          parser = Links()
          parser.feed(expected_page.decode("utf-8"))
          catalog_bytes = Path("finals/catalog.json").read_bytes()
          catalog = json.loads(catalog_bytes)
          assert len(catalog["files"]) == 71
          assert sum(row["pages"] for row in catalog["files"]) == 504
          expected = {row["path"]: row for row in catalog["files"]}

          def check(path):
              url = urljoin(base, quote(path, safe="/"))
              with urlopen(Request(url, headers=headers), timeout=60) as response:
                  data = response.read()
                  assert response.status == 200, (path, response.status)
                  if path.endswith(".pdf"):
                      assert response.headers.get_content_type() == "application/pdf", path
                      assert data.startswith(b"%PDF-") and b"%%EOF" in data[-2048:], path
                  assert data == Path(path).read_bytes(), (path, "Published bytes differ")
                  if path in expected:
                      assert len(data) == expected[path]["size"], path
                      assert hashlib.sha256(data).hexdigest() == expected[path]["sha256"], path
              return {"path": path, "status": 200, "bytes": len(data), "final_hash_checked": path in expected}

          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as pool:
              results = list(pool.map(check, sorted(parser.targets)))
          pdf_count = sum(row["path"].endswith(".pdf") for row in results)
          final_count = sum(row["final_hash_checked"] for row in results)
          assert pdf_count == 104 and final_count == 71
          report = {
              "site": base,
              "index_matches": True,
              "checked_routes": len(results) + 1,
              "pdf_routes": pdf_count,
              "final_sha256_matches": final_count,
              "results": results,
          }
          Path("pages-verification.json").write_text(json.dumps(report, indent=2, ensure_ascii=False), encoding="utf-8")
          print(json.dumps({key: value for key, value in report.items() if key != "results"}, ensure_ascii=False, indent=2))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("## Published archive verified\n\n")
              summary.write(f"- Live index matches the repository.\n- {pdf_count} PDF URLs return HTTP 200 and match repository bytes.\n- All {final_count} finals PDF SHA-256 checksums match.\n- {len(results) + 1} total routes verified.\n")
          PY
      - name: Save verification report
        uses: actions/upload-artifact@v4
        with:
          name: pages-verification
          path: pages-verification.json
          retention-days: 7
